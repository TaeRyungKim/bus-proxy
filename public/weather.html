<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>날씨</title>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
      var c = document.createElement("canvas");
      c.width = 180; c.height = 180;
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#0B1A2E";
      ctx.beginPath(); ctx.roundRect(0,0,180,180,36); ctx.fill();
      ctx.font = "110px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🌤️", 90, 95);
      var link = document.createElement("link");
      link.rel = "apple-touch-icon";
      link.href = c.toDataURL("image/png");
      document.head.appendChild(link);
    });
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B1A2E; color: #F1F5F9;
      font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      min-height: 100vh; padding: 20px 16px 40px;
    }
    .title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 20px; }
    .loc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .loc-btn {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 12px 8px; cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent; transition: all 0.15s;
    }
    .loc-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.08); }
    .loc-icon { font-size: 20px; margin-bottom: 4px; }
    .loc-label { font-size: 12px; font-weight: 700; color: #F1F5F9; }
    .loc-sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; }
    .error {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 12px; padding: 13px 16px; color: #FCA5A5;
      font-size: 13px; margin-bottom: 14px; text-align: center; display: none;
    }
    .spinner-wrap { text-align: center; padding: 60px 0; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.07);
      border-top: 3px solid rgba(255,255,255,0.55);
      border-radius: 50%; margin: 0 auto; animation: spin 0.85s linear infinite;
    }
    .spinner-txt { color: rgba(255,255,255,0.3); font-size: 13px; margin-top: 14px; }
    .main-card {
      background: linear-gradient(135deg, rgba(96,165,250,0.15), rgba(96,165,250,0.05));
      border: 1px solid rgba(96,165,250,0.2);
      border-radius: 20px; padding: 20px; margin-bottom: 12px; display: none;
    }
    .loc-tag { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 12px; }
    .main-row { display: flex; align-items: center; justify-content: space-between; }
    .big-temp { font-size: 64px; font-weight: 200; line-height: 1; letter-spacing: -2px; }
    .weather-txt { font-size: 15px; font-weight: 600; margin-top: 4px; }
    .feels-txt { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .big-emoji { font-size: 72px; }
    .card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; display: none;
    }
    .info-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; display: none; }
    .info-box {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 12px 14px;
    }
    .info-label { font-size: 11px; color: rgba(255,255,255,0.35); margin-bottom: 5px; }
    .info-value { font-size: 15px; font-weight: 700; }
    .section-label {
      font-size: 11px; color: rgba(255,255,255,0.35);
      font-weight: 600; letter-spacing: 0.5px; margin-bottom: 12px;
    }
    .hourly-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
    .hour-item { text-align: center; flex-shrink: 0; }
    .hour-label { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 6px; }
    .hour-emoji { font-size: 18px; margin-bottom: 4px; }
    .hour-temp { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .hour-rain { font-size: 10px; color: #60A5FA; }
    .dust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .summary {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; padding: 12px 14px; font-size: 12px;
      color: rgba(255,255,255,0.5); line-height: 1.8; display: none;
    }
    .empty { text-align: center; padding: 48px 0; color: rgba(255,255,255,0.2); font-size: 14px; line-height: 2; }
    .footer { margin-top: 24px; text-align: center; font-size: 10px; color: rgba(255,255,255,0.13); line-height: 2; }
  </style>
</head>
<body>

<div class="title">🌤️ 날씨</div>
<div class="subtitle">기상청 공식 데이터 · 오늘 하루 날씨</div>

<div class="loc-grid">
  <div class="loc-btn" onclick="loadGPS()">
    <div class="loc-icon" id="gpsIcon">📍</div>
    <div class="loc-label">현재 위치</div>
    <div class="loc-sub">GPS</div>
  </div>
  <div class="loc-btn" onclick="loadLoc(63,125,'🏢 삼평동','판교테크노밸리')">
    <div class="loc-icon">🏢</div>
    <div class="loc-label">회사</div>
    <div class="loc-sub">삼평동</div>
  </div>
  <div class="loc-btn" onclick="loadLoc(62,125,'🏠 마천동','송파구')">
    <div class="loc-icon">🏠</div>
    <div class="loc-label">집</div>
    <div class="loc-sub">마천동</div>
  </div>
</div>

<div class="error" id="errorBox"></div>
<div class="spinner-wrap" id="spinner">
  <div class="spinner"></div>
  <div class="spinner-txt">날씨 불러오는 중…</div>
</div>

<div class="main-card" id="mainCard">
  <div class="loc-tag" id="locTag"></div>
  <div class="main-row">
    <div>
      <div class="big-temp" id="bigTemp"></div>
      <div class="weather-txt" id="weatherTxt"></div>
      <div class="feels-txt" id="feelsTxt"></div>
    </div>
    <div class="big-emoji" id="bigEmoji"></div>
  </div>
</div>

<div class="info-grid-2" id="infoGrid">
  <div class="info-box"><div class="info-label">💧 습도</div><div class="info-value" id="humidity"></div></div>
  <div class="info-box"><div class="info-label">💨 바람</div><div class="info-value" id="wind"></div></div>
  <div class="info-box"><div class="info-label">🌧️ 강수확률</div><div class="info-value" id="rain"></div></div>
  <div class="info-box"><div class="info-label">🌡️ 최고/최저</div><div class="info-value" id="minmax"></div></div>
</div>

<!-- 미세먼지 (Open-Meteo) -->
<div class="card" id="dustCard">
  <div class="section-label">🌫️ 미세먼지</div>
  <div class="dust-grid" id="dustGrid"></div>
</div>

<!-- 시간별 예보 -->
<div class="card" id="hourlyCard">
  <div class="section-label">⏱ 시간별 예보</div>
  <div class="hourly-row" id="hourlyRow"></div>
</div>

<div class="summary" id="summary"></div>
<div class="empty" id="empty">위 버튼을 눌러서<br/>날씨를 확인해보세요</div>
<div class="footer">기상청 단기예보 · 미세먼지 Open-Meteo</div>

<script>
// 기상청 SKY/PTY 코드 → 날씨 텍스트/이모지
function getSkyInfo(sky, pty) {
  if (pty === "1") return {t:"비",        e:"🌧️"};
  if (pty === "2") return {t:"비/눈",     e:"🌨️"};
  if (pty === "3") return {t:"눈",        e:"❄️"};
  if (pty === "4") return {t:"소나기",    e:"🌦️"};
  if (sky === "1") return {t:"맑음",      e:"☀️"};
  if (sky === "3") return {t:"구름많음",  e:"⛅"};
  if (sky === "4") return {t:"흐림",      e:"☁️"};
  return {t:"알 수 없음", e:"🌡️"};
}
const windDir = (deg) => ["북","북동","동","남동","남","남서","서","북서"][Math.round(Number(deg)/45)%8];
const show  = (id) => document.getElementById(id).style.display = "block";
const showG = (id) => document.getElementById(id).style.display = "grid";
const hide  = (id) => document.getElementById(id).style.display = "none";
const set   = (id,v) => document.getElementById(id).textContent = v;
const setH  = (id,v) => document.getElementById(id).innerHTML = v;

function showLoading() {
  hide("empty"); hide("mainCard"); hide("infoGrid"); hide("dustCard");
  hide("hourlyCard"); hide("summary"); hide("errorBox");
  show("spinner");
}
function hideLoading() { hide("spinner"); }
function showError(msg) { hideLoading(); set("errorBox","⚠️ "+msg); show("errorBox"); }

// 위도/경도 → 기상청 격자 변환
function latLonToGrid(lat, lon) {
  const RE = 6371.00877, GRID = 5.0, SLAT1 = 30.0, SLAT2 = 60.0;
  const OLON = 126.0, OLAT = 38.0, XO = 43, YO = 136;
  const DEGRAD = Math.PI / 180.0;
  const re = RE / GRID, slat1 = SLAT1 * DEGRAD, slat2 = SLAT2 * DEGRAD;
  const olon = OLON * DEGRAD, olat = OLAT * DEGRAD;
  let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) / Math.tan(Math.PI * 0.25 + slat1 * 0.5);
  sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
  let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
  sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
  let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
  ro = re * sf / Math.pow(ro, sn);
  let ra = Math.tan(Math.PI * 0.25 + lat * DEGRAD * 0.5);
  ra = re * sf / Math.pow(ra, sn);
  let theta = lon * DEGRAD - olon;
  if (theta > Math.PI) theta -= 2.0 * Math.PI;
  if (theta < -Math.PI) theta += 2.0 * Math.PI;
  theta *= sn;
  return {
    nx: Math.floor(ra * Math.sin(theta) + XO + 0.5),
    ny: Math.floor(ro - ra * Math.cos(theta) + YO + 0.5)
  };
}

async function loadLoc(nx, ny, name, sub, lat, lon) {
  showLoading();
  try {
    // 기상청 API (Vercel 프록시 통해서)
    const wRes = await fetch(`/api/weather?nx=${nx}&ny=${ny}`);
    if (!wRes.ok) throw new Error("날씨 데이터 오류");
    const wData = await wRes.json();
    const items = wData?.response?.body?.items?.item;
    if (!items) throw new Error("날씨 데이터가 없어요");

    // 미세먼지는 Open-Meteo (CORS 없음)
    let aData = null;
    if (lat && lon) {
      try {
        const aRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5`);
        if (aRes.ok) aData = await aRes.json();
      } catch(e) {}
    }

    renderWeather(items, aData, name, sub);
  } catch(e) {
    showError(e.message);
  }
}

async function loadGPS() {
  if (!navigator.geolocation) { showError("위치 기능을 지원하지 않아요"); return; }
  document.getElementById("gpsIcon").textContent = "⏳";
  showLoading();
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      document.getElementById("gpsIcon").textContent = "📍";
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const grid = latLonToGrid(lat, lon);

      // 역지오코딩
      let locName = "현재 위치", locSub = "GPS";
      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`);
        const geoData = await geoRes.json();
        const addr = geoData.address;
        locName = addr.neighbourhood || addr.suburb || addr.quarter || addr.village || addr.town || addr.city || "현재 위치";
        locSub  = addr.city || addr.county || addr.state || "";
      } catch(e) {}

      loadLoc(grid.nx, grid.ny, "📍 " + locName, locSub, lat, lon);
    },
    () => {
      document.getElementById("gpsIcon").textContent = "📍";
      showError("위치 권한을 허용해주세요");
    },
    { timeout: 10000 }
  );
}

function dustLevel(pm, type) {
  const thresholds = type === "pm10"
    ? [{v:30,t:"좋음",e:"😊",c:"#22C55E"},{v:80,t:"보통",e:"🙂",c:"#EAB308"},{v:150,t:"나쁨",e:"😷",c:"#F97316"}]
    : [{v:15,t:"좋음",e:"😊",c:"#22C55E"},{v:35,t:"보통",e:"🙂",c:"#EAB308"},{v:75,t:"나쁨",e:"😷",c:"#F97316"}];
  for (const th of thresholds) { if (pm <= th.v) return th; }
  return {t:"매우나쁨",e:"🤢",c:"#EF4444"};
}

function renderWeather(items, aData, name, sub) {
  hideLoading();

  // 기상청 데이터 파싱 - fcstTime 기준으로 맵 구성
  const now = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Seoul"}));
  const nowHHMM = String(now.getHours()).padStart(2,"0") + "00";
  const byTime = {};
  let maxTemp = null, minTemp = null;

  for (const item of items) {
    const key = item.fcstDate + item.fcstTime;
    if (!byTime[key]) byTime[key] = { date: item.fcstDate, time: item.fcstTime };
    byTime[key][item.category] = item.fcstValue;
    if (item.category === "TMX") maxTemp = item.fcstValue;
    if (item.category === "TMN") minTemp = item.fcstValue;
  }

  // 현재 시각 데이터
  const todayStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
  const currentKey = todayStr + nowHHMM;
  const current = byTime[currentKey] || Object.values(byTime)[0];
  const wi = getSkyInfo(current?.SKY, current?.PTY);

  // 메인 카드
  set("locTag", `${name} · ${sub}`);
  set("bigTemp", Math.round(Number(current?.TMP || 0)) + "°");
  set("weatherTxt", wi.t);
  const maxT = maxTemp ? Math.round(Number(maxTemp)) : "-";
  const minT = minTemp ? Math.round(Number(minTemp)) : "-";
  set("feelsTxt", `최고 ${maxT}° / 최저 ${minT}°`);
  set("bigEmoji", wi.e);
  show("mainCard");

  // 상세 정보
  set("humidity", (current?.REH || "-") + "%");
  const wsdNum = Number(current?.WSD || 0);
  const vecNum = Number(current?.VEC || 0);
  set("wind", `${windDir(vecNum)} ${wsdNum.toFixed(1)}m/s`);
  set("rain", (current?.POP || "-") + "%");
  set("minmax", `${maxT}° / ${minT}°`);
  showG("infoGrid");

  // 미세먼지
  if (aData && aData.current) {
    const pm10 = Math.round(aData.current.pm10);
    const pm25 = Math.round(aData.current.pm2_5);
    const d10 = dustLevel(pm10, "pm10");
    const d25 = dustLevel(pm25, "pm25");
    setH("dustGrid", `
      <div class="info-box">
        <div class="info-label">PM10 미세먼지</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="font-size:24px">${d10.e}</span>
          <div>
            <div style="font-size:17px;font-weight:700;color:${d10.c}">${d10.t}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px">${pm10} ㎍/㎥</div>
          </div>
        </div>
      </div>
      <div class="info-box">
        <div class="info-label">PM2.5 초미세먼지</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="font-size:24px">${d25.e}</span>
          <div>
            <div style="font-size:17px;font-weight:700;color:${d25.c}">${d25.t}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px">${pm25} ㎍/㎥</div>
          </div>
        </div>
      </div>`);
    show("dustCard");
  }

  // 시간별 예보 (현재~+6시간)
  const sortedKeys = Object.keys(byTime)
    .filter(k => k.startsWith(todayStr))
    .sort();
  const currentIdx = sortedKeys.indexOf(currentKey);
  const hourKeys = sortedKeys.slice(currentIdx >= 0 ? currentIdx : 0, (currentIdx >= 0 ? currentIdx : 0) + 7);

  let hourHtml = "";
  hourKeys.forEach((key, i) => {
    const d = byTime[key];
    const wi2 = getSkyInfo(d?.SKY, d?.PTY);
    const pop = d?.POP || 0;
    const hour = d.time.slice(0,2);
    hourHtml += `
      <div class="hour-item">
        <div class="hour-label">${i === 0 ? "지금" : hour+"시"}</div>
        <div class="hour-emoji">${wi2.e}</div>
        <div class="hour-temp">${Math.round(Number(d?.TMP||0))}°</div>
        ${Number(pop) > 0 ? `<div class="hour-rain">${pop}%</div>` : ""}
      </div>`;
  });
  setH("hourlyRow", hourHtml);
  show("hourlyCard");

  // 한줄 요약
  const pop = Number(current?.POP || 0);
  let msg = "";
  if (pop >= 60)         msg = `☂️ 강수확률 ${pop}%. 우산 꼭 챙기세요!`;
  else if (pop >= 30)    msg = `🌂 강수확률 ${pop}%. 우산 챙기면 좋아요.`;
  else if (maxT >= 30)   msg = `🥵 최고 ${maxT}°로 더워요. 수분 보충 잊지 마세요!`;
  else if (minT <= 0)    msg = `🧊 최저 ${minT}°로 추워요. 따뜻하게 입으세요!`;
  else if (maxT >= 25)   msg = `😅 ${maxT}°로 따뜻해요. 가볍게 입으세요.`;
  else                   msg = `✅ 오늘 날씨 쾌적해요. 최고 ${maxT}° / 최저 ${minT}°`;
  set("summary", msg);
  show("summary");
}
</script>
</body>
</html>
